name: Build and push docker image

on:
  push:

defaults:
  run:
    shell: bash

jobs:
  build_and_push_image:
    strategy:
      matrix:
        os: [[self-hosted, x64, builder], [self-hosted, linux, arm64]]

    runs-on: ${{ matrix.os }}
    name: Build and Push Docker Image

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build And Push Image
        run: |
          ./build-image.sh build-and-push-arch-tag

  build_and_push_manifest:
    name: Build manifest docker image
    runs-on:
      group: ci-lite
      labels: [self-hosted, ci-lite]
    needs: [build_and_push_image]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manifest
        run: |
          ./build-image.sh push-manifest

      # The manifest tag matches the one build-image.sh constructs:
      # ghcr.io/flipstone/haskell-tools:debian-ghc-<GHC_VERSION>-<short-sha>
      - name: Compute image reference
        id: ref
        run: |
          . tool-versions.env
          echo "image=ghcr.io/flipstone/haskell-tools:debian-ghc-$GHC_VERSION-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Report-only scan of the freshly pushed manifest. Change exit-code to '1'
      # to turn findings into a build failure.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
