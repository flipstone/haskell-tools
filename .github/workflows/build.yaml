name: Build and push docker image

on:
  push:

# packages:write is needed to push images and layer caches to ghcr on
# regular runs. Dependabot-triggered runs only build (no pushes) and get a
# read-only GITHUB_TOKEN regardless of what is declared here unless
# permissions are explicit; declaring them also gives those runs the ghcr
# read access their cache pulls need. (Dependabot runs read the DOCKERHUB_*
# secrets from the separate Dependabot secrets store — see README.md.)
permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint scripts and Dockerfile
    runs-on:
      group: ci-lite
      labels: [self-hosted, ci-lite]

    steps:
      # Authenticated pulls from Docker Hub (the shellcheck and hadolint
      # images) avoid the anonymous rate limits.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Shellcheck
        run: docker compose run --rm shellcheck scripts/*.sh image/*.sh

      - name: Hadolint
        run: docker compose run --rm hadolint hadolint Dockerfile

  build_and_push_image:
    needs: [lint]
    strategy:
      matrix:
        os: [[self-hosted, x64, builder], [self-hosted, linux, arm64]]

    runs-on: ${{ matrix.os }}
    name: Build and Push Docker Image

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The base image comes from Docker Hardened Images, which requires
      # authentication even for the free Community tier. Docker Hub
      # credentials work for dhi.io.
      - name: Login to Docker Hardened Images registry
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build And Push Image
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: |
          ./scripts/build-image.sh build-and-push-arch-tag

      # Dependabot bumps should verify that the image still builds (reusing
      # the registry layer cache, so actions-only bumps are cheap) without
      # publishing anything.
      - name: Build Image without pushing (Dependabot)
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          ./scripts/build-image.sh build-arch-tag

  build_and_push_manifest:
    name: Build manifest docker image
    # Dependabot runs build without pushing, so there are no arch tags to
    # scan or to assemble into a manifest.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on:
      group: ci-lite
      labels: [self-hosted, ci-lite]
    needs: [build_and_push_image]

    steps:
      # Authenticated pulls from Docker Hub (aquasec/trivy for the scan step,
      # moby/buildkit for setup-buildx) avoid the anonymous rate limits.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Full history so the release-tag step can diff against the
      # before-sha of the push; the repo is small enough for this to be
      # cheap.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Report-only scan of the amd64 image pushed by the build job (the
      # arm64 image contents match closely enough that scanning it too
      # adds no signal), using the same compose trivy service developers
      # run locally. Runs before push-manifest so that setting
      # TRIVY_EXIT_CODE to '1' here would stop a vulnerable image from
      # being published under its manifest tag.
      - name: Scan images with Trivy
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-image.sh scan-amd64-tag

      # Surface the scan results on the run page and as a downloadable
      # artifact, even when the scan step itself fails.
      - name: Add Trivy results to the job summary
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          for report in trivy-reports/*.txt; do
            {
              echo "## Trivy scan: $(basename "$report" .txt)"
              echo '```'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Trivy reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: trivy-reports/

      - name: Build and push manifest
        run: |
          ./scripts/build-image.sh push-manifest

      # A release tag is what downstream Dependabot configs watch. Mint one
      # only for main builds that changed the image or how it is built, so
      # docs/CI-only merges don't open no-op bump PRs in every downstream
      # repo. An unknown before-sha (force push, newly created branch) errs
      # on the side of releasing.
      - name: Publish release tag
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          before='${{ github.event.before }}'
          if git cat-file -e "$before" 2>/dev/null &&
             ! git diff --name-only "$before" HEAD | grep -qE '^(Dockerfile|tool-versions\.env|image/|scripts/build-image\.sh)'; then
            echo "No image-affecting changes since $before; skipping release tag"
          else
            ./scripts/build-image.sh push-release-tag
          fi
