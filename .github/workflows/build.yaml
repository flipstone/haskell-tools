name: Build and push docker image

on:
  push:

defaults:
  run:
    shell: bash

jobs:
  build_and_push_image:
    strategy:
      matrix:
        os: [[self-hosted, x64, builder], [self-hosted, linux, arm64]]

    runs-on: ${{ matrix.os }}
    name: Build and Push Docker Image

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build And Push Image
        run: |
          ./build-image.sh build-and-push-arch-tag

  build_and_push_manifest:
    name: Build manifest docker image
    runs-on:
      group: ci-lite
      labels: [self-hosted, ci-lite]
    needs: [build_and_push_image]

    steps:
      # Authenticated pulls from Docker Hub (aquasec/trivy for the scan step,
      # moby/buildkit for setup-buildx) avoid the anonymous rate limits.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so push-manifest can compute the version tag's build
          # number from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Report-only scan of both arch images pushed by the build job, using the
      # same trivy-scan.sh developers run locally. Runs before push-manifest so
      # that setting TRIVY_EXIT_CODE to '1' here would stop a vulnerable image
      # from being published under its manifest tag.
      - name: Scan images with Trivy
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build-image.sh scan-arch-tags

      # Main-branch builds additionally publish the Dependabot-orderable
      # version tag (debian-ghc-<GHC_VERSION>-build-<N>) that consumer repos
      # pin; branch builds only get the sha tags.
      - name: Build and push manifest
        env:
          PUBLISH_VERSION_TAG: ${{ github.ref == 'refs/heads/main' }}
        run: |
          ./build-image.sh push-manifest
